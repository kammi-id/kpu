name: CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint, test, and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

  # Non-production: every push to a pull request, AND every push to main
  # (so preview never drifts stale after a PR merges), deploys to the
  # separate `kpu-preview` Worker (its own D1 database, R2 bucket, and
  # secrets — see wrangler.json's `env.preview`), never the kpu.kammi.id
  # production Worker.
  deploy-preview:
    name: Deploy preview (non-production)
    needs: ci
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # CLOUDFLARE_ENV selects which wrangler.json `env` the Cloudflare Vite
      # plugin builds for — this is what actually binds the Worker to the
      # preview D1/R2 resources, not the `wrangler deploy --env` flag.
      - name: Build (preview)
        run: npm run build
        env:
          CLOUDFLARE_ENV: preview

      - name: Apply D1 migrations (preview)
        run: npx wrangler d1 migrations apply DB --remote --env preview

      - name: Deploy (preview)
        run: npx wrangler deploy --env preview

      - name: Comment preview URL on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const marker = "<!-- kpu-preview-deploy -->";
            const body = `${marker}\n🚀 Preview deployed to https://kpu-preview.ppkammi2045.workers.dev`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((c) => c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

  # Production: only a push to main deploys the real kpu.kammi.id Worker,
  # bound to the production D1 database and R2 bucket at the top level of
  # wrangler.json.
  deploy:
    name: Deploy to Cloudflare Workers (production)
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply D1 migrations (production)
        run: npx wrangler d1 migrations apply DB --remote

      - name: Build
        run: npm run build

      - name: Deploy
        run: npx wrangler deploy
